<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="背单词">
  <title>英语期中背单词</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3.5" width="16" height="17" rx="3.5" />
              <path d="M8.4 16L11.6 8.6L14.8 16" />
              <path d="M9.5 13.7H13.7" />
              <circle cx="16.4" cy="8.2" r="1.15" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <h1 class="brand-title">英语期中背单词</h1>
        </div>
        <div class="header-right">
          <span id="offline-badge" class="offline-badge hidden">离线模式</span>
          <button type="button" id="audio-settings-btn" class="icon-btn" aria-label="语音设置" aria-expanded="false" aria-controls="audio-popover" title="语音设置">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7H14" />
              <path d="M18 7H20" />
              <circle cx="16" cy="7" r="2" />
              <path d="M4 17H6" />
              <path d="M10 17H20" />
              <circle cx="8" cy="17" r="2" />
            </svg>
          </button>
          <button type="button" id="theme-toggle-btn" class="icon-btn" aria-label="切换主题" title="切换主题">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.2 14.4A8.5 8.5 0 1 1 9.6 3.8a6.8 6.8 0 0 0 10.6 10.6Z" />
            </svg>
          </button>
          <span id="header-progress-pill" class="progress-pill">
            <svg class="bars-spinner" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(0 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(30 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(60 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(90 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(120 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(150 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(180 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(210 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(240 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(270 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(300 12 12)" />
              <line x1="12" y1="2.5" x2="12" y2="6.5" transform="rotate(330 12 12)" />
            </svg>
            <span>加载中</span>
          </span>
        </div>
        <div id="audio-popover" class="audio-popover hidden" role="dialog" aria-label="语音设置"></div>
      </div>
    </header>

    <main id="app-main" class="app-main" aria-live="polite">
      <div class="skeleton-shell" role="status" aria-label="正在加载词库">
        <div class="sk-panel">
          <div class="sk-row">
            <span class="sk-block sk-pill" style="width:74px;"></span>
            <span class="sk-block sk-pill" style="width:68px;"></span>
            <span class="sk-block sk-pill" style="width:68px;"></span>
            <span class="sk-block sk-pill" style="width:68px;"></span>
          </div>
          <div class="sk-row">
            <span class="sk-block sk-select" style="width:108px;"></span>
            <span class="sk-block sk-select" style="width:96px;"></span>
            <span class="sk-block sk-pill" style="width:92px;"></span>
          </div>
        </div>
        <div class="sk-meta">
          <span class="sk-block sk-line" style="width:88px;"></span>
          <span class="sk-block sk-line" style="width:116px;"></span>
        </div>
        <div class="sk-card">
          <div class="sk-card-top">
            <span class="sk-block sk-badge"></span>
            <span class="sk-block sk-circle"></span>
          </div>
          <div class="sk-card-center">
            <span class="sk-block sk-word"></span>
            <span class="sk-block sk-ipa"></span>
          </div>
          <div class="sk-card-bottom">
            <span class="sk-block sk-hint"></span>
          </div>
        </div>
        <div class="sk-actions">
          <span class="sk-block sk-action-btn"></span>
          <span class="sk-block sk-action-btn"></span>
          <span class="sk-block sk-action-btn"></span>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="sync-modal-root"></div>

    <nav class="bottom-nav" aria-label="功能导航">
      <button type="button" class="nav-btn active" data-tab="flashcard">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect class="icon-duotone" x="5" y="4" width="14" height="16" rx="2.75" />
            <rect x="5" y="4" width="14" height="16" rx="2.75" />
            <path d="M8.5 9.5H15.5" />
            <path d="M8.5 13.25H13" />
          </svg>
        </span>
        <span class="nav-label">闪卡</span>
      </button>
      <button type="button" class="nav-btn" data-tab="practice">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle class="icon-duotone" cx="12" cy="12" r="8.5" />
            <circle cx="12" cy="12" r="8.5" />
            <path d="M8.75 12.25L11 14.5L15.5 9.75" />
          </svg>
        </span>
        <span class="nav-label">测验</span>
      </button>
      <button type="button" class="nav-btn" data-tab="sentence">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path class="icon-duotone" d="M13.5 5.25L18.75 10.5L9.75 19.5H4.5V14.25L13.5 5.25Z" />
            <path d="M4.5 19.5H19.5" />
            <path d="M13.5 5.25L18.75 10.5L9.75 19.5H4.5V14.25L13.5 5.25Z" />
          </svg>
        </span>
        <span class="nav-label">句译</span>
      </button>
      <button type="button" class="nav-btn" data-tab="browse">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path class="icon-duotone" d="M4.5 5.75A2.5 2.5 0 0 1 7 3.25H12V19.25H7A2.5 2.5 0 0 0 4.5 21.75V5.75Z" />
            <path class="icon-duotone" d="M19.5 5.75A2.5 2.5 0 0 0 17 3.25H12V19.25H17A2.5 2.5 0 0 1 19.5 21.75V5.75Z" />
            <path d="M4.5 5.75A2.5 2.5 0 0 1 7 3.25H12V19.25H7A2.5 2.5 0 0 0 4.5 21.75V5.75Z" />
            <path d="M19.5 5.75A2.5 2.5 0 0 0 17 3.25H12V19.25H17A2.5 2.5 0 0 1 19.5 21.75V5.75Z" />
          </svg>
        </span>
        <span class="nav-label">词库</span>
      </button>
      <button type="button" class="nav-btn" data-tab="progress">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect class="icon-duotone" x="5.5" y="11" width="3.5" height="8" rx="1.2" />
            <rect class="icon-duotone" x="10.25" y="6.5" width="3.5" height="12.5" rx="1.2" />
            <rect class="icon-duotone" x="15" y="9" width="3.5" height="10" rx="1.2" />
            <path d="M4.5 19.25H19.5" />
            <path d="M7.25 16.5V12.25" />
            <path d="M12 16.5V7.25" />
            <path d="M16.75 16.5V9.75" />
          </svg>
        </span>
        <span class="nav-label">进度</span>
      </button>
    </nav>
  </div>

  <script src="./js/core.js" defer></script>
  <script src="./js/views-study.js" defer></script>
  <script src="./js/views-hub.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
