<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="背单词">
  <title>英语期中背单词</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-dot" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3.5" width="16" height="17" rx="3" />
              <path d="M8.5 15.5L11.5 8.5L14.5 15.5" />
              <path d="M9.4 13.5H13.6" />
              <circle cx="16.5" cy="8.5" r="1" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <h1 class="brand-title">英语期中背单词</h1>
        </div>
        <div class="header-right">
          <span id="offline-badge" class="offline-badge hidden">离线模式</span>
          <span id="header-progress-pill" class="progress-pill">已认识 0/0</span>
        </div>
      </div>
    </header>

    <main id="app-main" class="app-main" aria-live="polite">
      <div class="loading-box">正在加载词库...</div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <nav class="bottom-nav" aria-label="功能导航">
      <button type="button" class="nav-btn active" data-tab="flashcard">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="4" width="14" height="16" rx="2.5" />
            <path d="M8.5 9.5H15.5" />
            <path d="M8.5 13H12.5" />
          </svg>
        </span>
        <span class="nav-label">闪卡</span>
      </button>
      <button type="button" class="nav-btn" data-tab="quiz">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M8.8 12.2L11 14.4L15.4 9.8" />
          </svg>
        </span>
        <span class="nav-label">四选一</span>
      </button>
      <button type="button" class="nav-btn" data-tab="sentence">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5H20" />
            <path d="M13.5 5.5L18.5 10.5L9.5 19.5H4.5V14.5L13.5 5.5Z" />
          </svg>
        </span>
        <span class="nav-label">句译</span>
      </button>
      <button type="button" class="nav-btn" data-tab="exam">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3.5H7.5A2.5 2.5 0 0 0 5 6V18A2.5 2.5 0 0 0 7.5 20.5H16.5A2.5 2.5 0 0 0 19 18V8.5L14 3.5Z" />
            <path d="M14 3.5V8.5H19" />
            <path d="M8.5 13H15.5" />
            <path d="M8.5 16.5H13" />
          </svg>
        </span>
        <span class="nav-label">模考</span>
      </button>
      <button type="button" class="nav-btn" data-tab="browse">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 5.5A2.5 2.5 0 0 1 7 3H12V19.5H7A2.5 2.5 0 0 0 4.5 22V5.5Z" />
            <path d="M19.5 5.5A2.5 2.5 0 0 0 17 3H12V19.5H17A2.5 2.5 0 0 1 19.5 22V5.5Z" />
          </svg>
        </span>
        <span class="nav-label">词库</span>
      </button>
      <button type="button" class="nav-btn" data-tab="progress">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 19.5H19" />
            <path d="M7.5 16.5V12.5" />
            <path d="M12 16.5V7.5" />
            <path d="M16.5 16.5V10" />
          </svg>
        </span>
        <span class="nav-label">进度</span>
      </button>
    </nav>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
